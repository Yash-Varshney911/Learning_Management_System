{% extends 'Base.html' %}
{% load static %}


{% block title %}
CONTACT US
{% endblock %}


{% block content %}

<div class="row pb-5 mb-5">
    <p class="fs-3 text-center py-4">Contact <b class="text-mc-red">Us</b> </p>
    <div class="col-sm-8 mx-auto">
        <div class="row py-3">
            <div class="col-sm-6 rounded-5 py-5 ps-4 pe-5 con">
                <form method="post">
                    {% csrf_token %}
                    <input type="text" required placeholder="Enter your full name" name="name" class="form-control txt">
                    <input type="number" required placeholder="Enter your Mobile Number" name="mob"
                        class="form-control txt">
                    <input type="email" required placeholder="Enter your Email" name="email" class="form-control txt">
                    <textarea name="msg" class="form-control ta" required
                        placeholder="Enter Some words about yourself"></textarea>
                    <input type="submit" value="Save"
                        class="mt-5 ms-3 rounded-pill btn1 form-control bg-mc-red border-0">
                </form>
            </div>
            <div class="col-sm-6 p-5 rounded-5 bgcon">
                <p class="fs-3 pt-5 mt-3 pb-3">Contact <b class="text-mc-red"> Address</b></p>
                <p class="mt-3"><i class="fa-solid fa-location-dot"></i> Ganesh Colony Gali No 9A, Chandausi, Sambhal,
                    Uttar Pradesh
                    - 244412 </p>
                <p class="mb-5"><i class="fa-solid fa-phone"></i> +91 9119015065 </p>
                <p class="pt-5 mt-5 text-center">
                    <a href="https://youtube.com/@yashvarshney1?si=sw-72G36H-HufadU" target="_blank"
                        style="text-decoration: none;">
                        <i class="fa-brands ic fa-square-youtube"></i>
                    </a>
                    <a href="#" target="_blank" style="text-decoration: none;">
                        <i class="fa-brands ic fa-linkedin"></i>
                    </a>
                    <a href="#" target="_blank" style="text-decoration: none;">
                        <i class="fa-brands ic fa-facebook"></i>
                    </a>
                    <a href="https://wa.me/9119015065" target="_blank" style="text-decoration: none;">
                        <i class="fa-brands ic fa-whatsapp"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
